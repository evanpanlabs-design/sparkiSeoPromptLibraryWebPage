      - "film grain"
      - "anamorphic"
      - "shallow depth of field"
      - "f-stop"
      - "35mm"
      - "kodak portra 400"
    character-design:
      - "character sheet"
      - "turnaround"
      - "expression sheet"
      - "animation ready"
    product-photography:
      - "product shot"
      - "studio lighting"
      - "white background"
      - "high-key lighting"
    video-generation:
      - "motion blur"
      - "dynamic pose"
      - "cinematic frame"
    image-generation:
      - "detailed illustration"
      - "digital art"
      - "8k resolution"
    other:
      - "high quality"
      - "vibrant colors"
      - "professional composition"